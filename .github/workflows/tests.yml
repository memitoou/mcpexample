name: Pruebas E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Pruebas (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Ejecutar pruebas
        run: npm test

      - name: Generar reporte Cucumber
        if: always()
        run: npm run report

      - name: Publicar reporte Cucumber y traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 14

      - name: Publicar resultados Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 14

  allure-report:
    name: Resultado final
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Unir resultados de todos los navegadores
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Descargar historial de Allure publicado
        run: |
          mkdir -p allure-history
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.jsonl" \
            -o /tmp/history.jsonl && mv /tmp/history.jsonl allure-history/history.jsonl || echo "Sin historial previo"

      - name: Generar reporte Allure
        run: |
          npm run allure:generate
          cp allure-history/history.jsonl allure-report/history.jsonl || true

      - name: Publicar reporte Allure
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Preparar Allure para GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # Check único para la protección de rama: falla si algún navegador falló
      - name: Verificar resultado de las pruebas
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "Las pruebas fallaron en al menos un navegador (${{ needs.test.result }})"
          exit 1

  deploy-allure:
    name: Publicar en GitHub Pages
    needs: allure-report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar Allure en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
