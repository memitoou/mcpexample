name: Pruebas E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas
        run: npm test
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          LOGIN_NAME: ${{ secrets.LOGIN_NAME }}

      - name: Generar reporte
        if: always()
        run: npm run report

      - name: Publicar reporte y traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: |
            reports/
            test-results/
          retention-days: 14
